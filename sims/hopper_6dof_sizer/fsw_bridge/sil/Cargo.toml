[package]
name = "hopper_sil"
version = "0.1.0"
edition = "2021"
description = "Software-in-the-loop: luna's Rust LQR controller flying the Simulink-generated hopper environment"
publish = false

[dependencies]
# Same versions luna's common/flight2 use, so its ctv.rs and lqr.rs compile unchanged
nalgebra = { version = "0.34.1", features = ["serde-serialize"] }
rkyv = "0.7.40"
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
cc = "1.0"
